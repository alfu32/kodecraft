name: Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or tag to release (empty uses the branch/tag selected in Run workflow)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - id: meta
        name: Resolve the selected source and release version
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.ref }}
        run: python3 scripts/release-meta.py >> "$GITHUB_OUTPUT"

  validate:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install build prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config libssl-dev
      - name: Locked Rust and repository checks
        run: |
          cargo fmt --all --check
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
          python3 scripts/credits.py --check
          python3 scripts/tasks.py --check

  jdbc:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test the platform-neutral JDBC adapter
        run: |
          bash scripts/build-jdbc-helper.sh
          mkdir -p target/jdbc-release
          cp jdbc-bridge/target/kode-jdbc-bridge.jar "target/jdbc-release/kode-jdbc-bridge-${{ needs.prepare.outputs.version }}.jar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jdbc-adapter
          path: target/jdbc-release/*.jar
          if-no-files-found: error

  build:
    needs: [prepare, validate, jdbc]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, os: linux, arch: x86_64, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, os: linux, arch: aarch64, target: aarch64-unknown-linux-gnu }
          - { runner: windows-2025, os: windows, arch: x64, target: x86_64-pc-windows-msvc }
          - { runner: windows-11-arm, os: windows, arch: arm64, target: aarch64-pc-windows-msvc }
          - { runner: macos-15-intel, os: macos, arch: x86_64, target: x86_64-apple-darwin }
          - { runner: macos-15, os: macos, arch: aarch64, target: aarch64-apple-darwin }
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_DATE_EPOCH: '1767225600'
      KODE_BUILD_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jdbc-adapter
          path: target/jdbc-release
      - name: Install Linux packagers and native headers
        if: matrix.os == 'linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config libssl-dev desktop-file-utils squashfs-tools snapd libfuse2t64
      - name: Build native application
        run: cargo build --release --locked -p kode --target ${{ matrix.target }}
      - name: Assemble portable archives
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/kode"
          if [[ '${{ matrix.os }}' == windows ]]; then binary="${binary}.exe"; fi
          python scripts/package-portable.py --target '${{ matrix.target }}' --binary "$binary" --helper 'target/jdbc-release/kode-jdbc-bridge-${{ needs.prepare.outputs.version }}.jar' --output target/release-assets
      - name: Build optional native Java runtime
        run: python scripts/build-java-runtime.py --target ${{ matrix.target }} --output target/release-assets
      - name: Build AppImage and Snap
        if: matrix.os == 'linux'
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          archive="target/release-assets/kode-${RELEASE_VERSION}-${RELEASE_TARGET}.tar.gz"
          python3 scripts/package-appimage.py --archive "$archive" --output target/release-assets
          python3 scripts/package-snap.py --packer snap --archive "$archive" --output target/release-assets
      - name: Build MSI and MSIX
        if: matrix.os == 'windows'
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch '${{ matrix.arch }}' -Version '${{ needs.prepare.outputs.version }}'
      - name: Build DMG
        if: matrix.os == 'macos'
        run: bash packaging/macos/package.sh '${{ needs.prepare.outputs.version }}' '${{ matrix.target }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: target/release-assets/*
          if-no-files-found: error

  publish:
    needs: [prepare, validate, jdbc, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: incoming
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jdbc-adapter
          path: incoming
      - name: Verify the complete matrix and publish the release
        run: |
          python3 scripts/verify-release.py --directory incoming --version "$RELEASE_VERSION" --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"
          gh release create "$RELEASE_TAG" incoming/* --target "$RELEASE_SHA" --title "Kode $RELEASE_TAG" --notes-file target/release-notes.md
