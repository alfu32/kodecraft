name: Optional JDBC Java runtime
on:
  push:
    paths:
      - scripts/build-java-runtime.py
      - .github/workflows/java-runtime.yaml
  pull_request:
    paths:
      - scripts/build-java-runtime.py
      - .github/workflows/java-runtime.yaml
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Build runtime separately from the application and drivers
        run: python3 scripts/build-java-runtime.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kode-jdbc-runtime-x86_64-unknown-linux-gnu
          path: target/java-runtime-artifacts/*
          if-no-files-found: error
  publish:
    if: github.event_name == 'release'
    needs: runtime
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kode-jdbc-runtime-x86_64-unknown-linux-gnu
          path: runtime-assets
      - name: Attach the optional runtime and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" runtime-assets/* --clobber
