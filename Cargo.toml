[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/kode"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["preserve_order", "arbitrary_precision"] }
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
crossterm = "=0.29.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "signal", "test-util"] }
tokio-util = { version = "0.7", features = ["rt", "codec"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
tempfile = "3.27"
nix = { version = "0.30", default-features = false, features = ["signal", "process", "fs", "user"] }
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
unicode-width = "0.2.2"
ropey = { version = "=1.6.1", default-features = false, features = ["simd"] }
sha2 = "=0.10.9"
hmac = "=0.12.1"
digest_auth = "=0.3.1"
ntlmclient = "=0.2.0"
hawk = "=5.0.1"
oauth1-request = { version = "=0.6.1", default-features = false, features = ["std", "hmac-sha1"] }
aws-sigv4 = "=1.6.0"
aws-credential-types = "=1.3.0"
time = { version = "=0.3.55", features = ["formatting", "macros"] }
base64 = "=0.23.1"
uuid = { version = "=1.28.0", features = ["v4"] }
url = "=2.5.8"
http = "=1.5.0"
mime = "=0.3.17"
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize"] }
cookie_store = { version = "=0.22.1", default-features = false }
psl = "=2.1.241"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls-platform-verifier = "=0.7.1"
eventsource-stream = "=0.2.3"
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
arboard = { version = "=3.6.1", default-features = false }
unicode-general-category = "=0.6.0"
regex = "=1.13.1"
fancy-regex = "=0.19.2"
ignore = "=0.4.33"
notify = "=8.2.0"
infer = "=0.22.0"
mime_guess = "=2.0.5"
image = { version = "=0.25.10", default-features = false, features = ["png", "bmp", "gif", "tga", "dds", "jpeg", "webp", "ico", "tiff", "pnm", "qoi", "hdr"] }
resvg = { version = "=0.47.0", default-features = false, features = ["text", "system-fonts", "raster-images"] }
psd = "=0.3.5"
zip = { version = "=9.0.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream"] }
tar = { version = "=0.4.46", default-features = false }
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
lsp-types = "=0.97.0"
git2 = { version = "=0.21.0", default-features = false, features = ["vendored-libgit2"] }
indexmap = { version = "=2.14.2", features = ["serde"] }
tree-sitter = "=0.26.13"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "hooks", "limits"] }
tree-sitter-kotlin-sg = "=0.4.1"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-python = "=0.25.0"
tree-sitter-json = "=0.24.8"
tree-sitter-php = "=0.25.1"
tree-sitter-css = "=0.25.0"
tree-sitter-html = "=0.23.2"
roxmltree = "=0.21.1"
percent-encoding = "=2.3.2"
tree-sitter-go = "=0.25.0"
tree-sitter-ruby = "=0.23.1"
tree-sitter-bash = "=0.25.1"
tree-sitter-swift = "=0.7.4"
tree-sitter-sequel = "=0.3.11"
tree-sitter-zig = "=1.1.2"
tree-sitter-md = "=0.5.3"
tree-sitter-lua = "=0.5.0"
tree-sitter-svelte-ng = "=1.0.2"
tree-sitter-perl = "=1.1.2"
tree-sitter-d = "=0.8.2"
tree-sitter-yaml = "=0.7.2"
tree-sitter-pascal = "=0.10.2"
tree-sitter-ocaml = "=0.26.0"
tree-sitter-c-sharp = "=0.23.5"

kode = { path = "crates/kode" }
kode-core = { path = "crates/kode-core" }
kode-platform = { path = "crates/kode-platform" }
kode-workspace = { path = "crates/kode-workspace" }
kode-syntax = { path = "crates/kode-syntax" }
kode-intelligence = { path = "crates/kode-intelligence" }
kode-lsp = { path = "crates/kode-lsp" }
kode-git = { path = "crates/kode-git" }
kode-rest = { path = "crates/kode-rest" }
kode-database = { path = "crates/kode-database" }
kode-tui = { path = "crates/kode-tui" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
